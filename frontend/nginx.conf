# Nginx configuration for POS Apotek V2 Frontend & API proxy
# Exposes Port 80 for HTTP and template Port 443 for HTTPS (Local SSL)

# Upstream backend dengan keepalive untuk performa koneksi ulang yang efisien
upstream backend_upstream {
    server backend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Optional: Redirect HTTP to HTTPS (uncomment when SSL is active)
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # Global proxy timeout — mencegah 502/504 saat backend lambat merespons
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;
    proxy_set_header        Connection "";

    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer response backend agar tidak timeout ke klien
        proxy_buffer_size          16k;
        proxy_buffers              4 32k;
        proxy_busy_buffers_size    64k;

        # Retry ke backend sekali jika terjadi error koneksi/timeout (bukan POST)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom error page untuk 502/504 agar klien mendapat pesan yang informatif
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        return 200 '{"error":"Server sedang memulai, coba beberapa saat lagi","code":503}';
        add_header Content-Type application/json;
    }
}

